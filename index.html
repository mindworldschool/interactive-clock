<html lang="uk">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Інтерактивний годинник — MindWorld School</title>
  <!-- Общая оболочка публичных тренажёров: шапка, языки, шрифты, цвета -->
  <link rel="stylesheet" href="/trainer-shell/shell.v1.css">
  <link rel="stylesheet" href="styles/clock.css?v=2">
  <script src="/trainer-shell/shell.v1.js"></script>
</head>
<body>
  <!-- Сюда оболочка вставит шапку (лого, название, UA / EN / RU / ES) -->
  <div id="mw-header"></div>

  <main class="main-wrap">
    <div class="play-layout">
      <!-- Карточка с часами -->
      <section class="clock-card">
        <div class="clock-scale">
          <div class="face"></div>

          <!-- слой для всплывающих надписей -->
          <div class="feedback-clip"></div>

          <!-- конфетти, обрезанное кругом -->
          <div class="confetti-wrap"><canvas class="confetti-canvas"></canvas></div>

          <div class="hand hour"></div>
          <div class="hand minute"></div>
          <div class="hand second"></div>
          <div class="cap"></div>
          <img src="assets/leo_center.png" alt="" class="leo-center">
        </div>
      </section>

      <!-- Карточка управления: на компьютере справа от часов, на телефоне под ними -->
      <aside class="controls-card">
        <!-- Табло: подпись (зараз / стрілки показують / постав стрілки) и время -->
        <div class="board">
          <div class="board-label" id="boardLabel"></div>
          <span id="digitalTime" class="digital">--:--:--</span>
        </div>

        <!-- Что делать в текущем режиме -->
        <p class="mode-hint" id="modeHint"></p>

        <div class="controls-row mode-switch pill-switch" role="group" aria-label="Режим годинника">
          <button type="button" class="active" data-mode="current">Звичайний</button>
          <button type="button" data-mode="training">Тренування</button>
        </div>

        <div class="controls-row train-switch pill-switch" role="group" aria-label="Режим тренування">
          <button type="button" class="active" data-train="free">Вільно</button>
          <button type="button" data-train="task">Завдання</button>
        </div>

        <div class="controls-row task-actions">
          <button type="button" class="btn-task">Нове завдання</button>
          <button type="button" class="btn-check">Перевірка</button>
        </div>

        <div class="task-msg-row hidden">
          <div class="task-target hidden">
            <span class="task-title">Завдання:</span> <strong class="target-time">--:--</strong>
          </div>
          <div class="task-msg" aria-live="polite"></div>
        </div>
      </aside>
    </div>
  </main>

  <!-- Шапка и язык — из общей оболочки: ?lang= → сохранённый выбор → браузер → украинский.
       Язык передаём в clock.js через window.APP_LANG, смену — событием mw:langchange -->
  <script>
    MWShell.init({
      title: {
        ua: "Інтерактивний годинник",
        en: "Interactive Clock",
        ru: "Интерактивные часы",
        es: "Reloj interactivo"
      },
      tagline: {
        ua: "Вчимося визначати час",
        en: "Learn to tell the time",
        ru: "Учимся определять время",
        es: "Aprende a leer la hora"
      },
      docTitle: {
        ua: "Інтерактивний годинник — MindWorld School",
        en: "Interactive Clock — MindWorld School",
        ru: "Интерактивные часы — MindWorld School",
        es: "Reloj interactivo — MindWorld School"
      },
      ukrainianCode: "ua",
      onLangChange: function (lang) { window.APP_LANG = lang; }
    });
  </script>

  <!-- Аудио -->
  <audio id="sndTick"    src="sounds/tick.mp3" preload="auto" loop playsinline></audio>
  <audio id="sndClick1"  src="sounds/click.mp3" preload="auto" playsinline></audio>
  <audio id="sndClick2"  src="sounds/click.mp3" preload="auto" playsinline></audio>
  <audio id="sndClick3"  src="sounds/click.mp3" preload="auto" playsinline></audio>
  <audio id="sndFanfare" src="sounds/fanfare.mp3" preload="auto" playsinline></audio>
  <audio id="sndFail"    src="sounds/fail.mp3" preload="auto" playsinline></audio>

  <!-- Скрипт после <audio>: иначе он не находит звуки при запуске -->
  <script src="scripts/clock.js?v=2"></script>
</body>
</html>
